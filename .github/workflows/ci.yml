name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.21'
          python-version: '3.13'
      - run: uv sync --locked --no-dev
      - run: uv run --locked --no-dev python -m unittest discover -s tests -v
      - run: uv run --locked --no-dev python examples/make_demo.py
      - run: git diff --exit-code -- examples/demo.html examples/demo.snapshot.json examples/demo.annotations.json examples/demo.report.json
      - run: uv run --locked --no-dev python scripts/check_release.py
  reader-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.21'
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m playwright install --with-deps chromium
      - run: uv run --locked python tests/browser_smoke.py
      - run: uv build
      - run: uv run --locked twine check dist/*
