name: Test coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.21'
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run --locked coverage run -m unittest discover -s tests -v
      - run: uv run --locked coverage combine
      - run: uv run --locked coverage report
      - uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: save_coverage_data_files
          ANNOTATE_MISSING_LINES: false
